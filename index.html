<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const videoInput = document.getElementById("videoInput");
const screenBtn = document.getElementById("screenBtn");

const colorInput = document.getElementById("color");
const tol = document.getElementById("tol");
const tolText = document.getElementById("tolText");
const feather = document.getElementById("feather");
const featherText = document.getElementById("featherText");
const spillCheck = document.getElementById("spill");

const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const download = document.getElementById("download");
const formatSelect = document.getElementById("format");

let recorder;
let chunks = [];
let animationId;
let isScreenSharing = false;

const OUTPUT_WIDTH = 2560;
const OUTPUT_HEIGHT = 1440;
const OUTPUT_FPS = 60;
const VIDEO_BITRATE = 40000000;

tol.oninput = () => { tolText.textContent = tol.value; };
feather.oninput = () => { featherText.textContent = feather.value; };

// ファイル選択時の処理
videoInput.onchange = e => {
  stopScreenShare();
  const file = e.target.files[0];
  if (file) {
    video.srcObject = null;
    video.src = URL.createObjectURL(file);
    video.loop = true;
    video.play().then(() => {
      startProcessing();
    }).catch(err => {
      alert("動画の再生に失敗しました: " + err.message);
    });
  }
};

// 画面共有（エラー表示強化版）
screenBtn.onclick = async () => {
  // file:// プロトコルのチェック
  if (window.location.protocol === 'file:') {
    alert("【エラー】file:// プロトコル（ファイルを直接ブラウザで開いている状態）では画面共有機能が動作しません。\n\nLive ServerなどのローカルWebサーバー経由（http://localhost/...）で実行してください。");
    return;
  }

  // APIの存在チェック
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert("お使いのブラウザや環境は画面共有（getDisplayMedia）に対応していません。\nChrome, Edge, Firefoxの最新版をご使用ください。");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { 
        frameRate: { ideal: OUTPUT_FPS, max: OUTPUT_FPS } 
      },
      audio: false
    });
    
    stopScreenShare(); // 既存のストリームを停止
    video.src = "";
    video.srcObject = stream;
    isScreenSharing = true;
    
    // ユーザーがブラウザの「共有を停止」を押したときの処理
    stream.getVideoTracks()[0].onended = () => {
      stopScreenShare();
    };

    await video.play();
    startProcessing();
  } catch (err) {
    console.error("画面共有エラー:", err);
    if (err.name === 'NotAllowedError') {
      alert("画面共有がキャンセルされたか、ブラウザの権限で拒否されました。");
    } else {
      alert("画面共有の開始に失敗しました:\n" + err.message);
    }
  }
};

function stopScreenShare() {
  if (video.srcObject) {
    const tracks = video.srcObject.getTracks();
    tracks.forEach(track => track.stop());
    video.srcObject = null;
  }
  isScreenSharing = false;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return {
    r: (n >> 16) & 255,
    g: (n >> 8) & 255,
    b: n & 255
  };
}

// 描画ループとアルファ切り抜き処理
function render() {
  if (video.paused || video.ended) {
    animationId = requestAnimationFrame(render);
    return;
  }

  canvas.width = OUTPUT_WIDTH;
  canvas.height = OUTPUT_HEIGHT;

  ctx.drawImage(video, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

  const frame = ctx.getImageData(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
  const data = frame.data;

  const key = hexToRgb(colorInput.value);
  const cutoff = Number(tol.value);
  const featherVal = Number(feather.value);
  const maxDist = cutoff + featherVal;
  const doSpill = spillCheck.checked;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const dist = Math.sqrt(
      (r - key.r) ** 2 +
      (g - key.g) ** 2 +
      (b - key.b) ** 2
    );

    if (dist < cutoff) {
      data[i + 3] = 0;
    } else if (dist < maxDist) {
      const alphaFactor = (dist - cutoff) / featherVal;
      data[i + 3] = Math.floor(data[i + 3] * alphaFactor);
    }

    if (doSpill && data[i + 3] > 0) {
      if (key.g > key.r && key.g > key.b) {
        const maxAllowedG = (r + b) / 2;
        if (g > maxAllowedG) {
          data[i + 1] = maxAllowedG;
        }
      }
    }
  }

  ctx.putImageData(frame, 0, 0);
  animationId = requestAnimationFrame(render);
}

function startProcessing() {
  if (animationId) cancelAnimationFrame(animationId);
  render();
}

// 録画機能
startBtn.onclick = () => {
  if (!video.src && !video.srcObject) {
    alert("動画または画面共有を選択してください！");
    return;
  }

  chunks = [];
  canvas.width = OUTPUT_WIDTH;
  canvas.height = OUTPUT_HEIGHT;

  const stream = canvas.captureStream(OUTPUT_FPS);
  const selectedFormat = formatSelect.value;
  const mimeType = "video/webm;codecs=vp9";

  try {
    recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: VIDEO_BITRATE
    });
  } catch (e) {
    alert("VP9形式の録画に対応していません");
    return;
  }

  recorder.ondataavailable = e => {
    if (e.data.size > 0) {
      chunks.push(e.data);
    }
  };

  recorder.onstop = () => {
    let extension = selectedFormat === "mov" ? "mov" : "webm";
    const blob = new Blob(chunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);

    download.href = url;
    download.download = "transparent-video." + extension;
    download.textContent = extension.toUpperCase() + "をダウンロード";
  };

  recorder.start(100);
  startBtn.disabled = true;
  stopBtn.disabled = false;
};

stopBtn.onclick = () => {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }
  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>
